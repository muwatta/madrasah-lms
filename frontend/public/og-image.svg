<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Madrasah LMS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.5" stop-color="#020617"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="420" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <rect x="520" y="86" width="160" height="160" rx="36" fill="url(#accent)"/>
  <text x="600" y="202" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="96" fill="#022c22">M</text>

  <text x="600" y="350" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="72" fill="#ffffff">Madrasah LMS</text>
  <text x="600" y="420" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="34" fill="#a7f3d0">منصة إدارة المدارس الإسلامية</text>
</svg>
